name: Keep Backend Awake

# This pings your Render backend every 10 minutes, 24/7, so Render's free
# plan never puts it to sleep. This means Admin, Teacher, and Parent portals
# stay instantly available with no "waking up" delay.
#
# IMPORTANT: change the URL below to your actual Render URL if it's different.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: curl -s -o /dev/null -w "Backend responded: %{http_code}\n" https://richseed-backend.onrender.com/
